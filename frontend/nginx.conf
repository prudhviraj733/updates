server {
    listen 80;
    server_name _;

    # Allow larger uploads (refund/replacement photos, images)
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Static asset caching
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all API traffic to the FastAPI backend (same origin -> no CORS issues)
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve headers used for platform (web/app) analytics
        proxy_set_header X-Client-Platform $http_x_client_platform;
        proxy_set_header X-Visitor-Id $http_x_visitor_id;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # SEO: expose dynamic robots.txt & sitemap.xml at the site root
    location = /robots.txt {
        proxy_pass http://backend:8001/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8001/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
