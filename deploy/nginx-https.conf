# OPTIONAL: host-level nginx for TLS termination via Certbot.
# Use this only if you are NOT fronting with Cloudflare/Traefik/Caddy.
#
# Steps:
#   1. In deploy/docker-compose.yml change the frontend ports to:
#        ports: ["127.0.0.1:8080:80"]
#   2. sudo apt-get install -y nginx certbot python3-certbot-nginx
#   3. Copy this file to /etc/nginx/sites-available/freshly and symlink to
#      sites-enabled, set your domain, then: sudo certbot --nginx -d your-domain.com
#   4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve platform-analytics headers
        proxy_set_header X-Client-Platform $http_x_client_platform;
        proxy_set_header X-Visitor-Id $http_x_visitor_id;
        proxy_read_timeout 300s;
    }
}

# After running certbot, it rewrites this server block to listen on 443 with
# your Let's Encrypt certificate and adds an HTTP->HTTPS redirect automatically.
