# Freshly Grocery — production deployment (Hostinger VPS / any Docker host)
# Usage:  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
#
# NOTE: The frontend URL (REACT_APP_BACKEND_URL) is baked at BUILD time by CRA,
# so after changing it you must rebuild the frontend image.

services:
  # ---------------------------------------------------------------------------
  # MongoDB. For production you may INSTEAD use MongoDB Atlas: set MONGO_URL to
  # your Atlas SRV string in .env and delete/comment this whole service.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not published to the host — only reachable inside the compose network.

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      - mongo
    # Load ALL runtime variables directly from deploy/.env into the container.
    # This is robust: it does not depend on ${VAR} interpolation, so backend
    # secrets (JWT_SECRET, MONGO_URL, CORS_ORIGINS, integrations) are always
    # delivered. If .env is missing, compose fails fast with a clear error.
    env_file:
      - .env
    expose:
      - "8001"

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # For HTTPS, terminate TLS in front (Caddy/Traefik/Cloudflare/Certbot).
      # See README for a Certbot + host-nginx option.

volumes:
  mongo_data:
