# Freshly Grocery — production deployment (Hostinger VPS / any Docker host)
# Usage:  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
#
# NOTE: The frontend URL (REACT_APP_BACKEND_URL) is baked at BUILD time by CRA,
# so after changing it you must rebuild the frontend image.

services:
  # ---------------------------------------------------------------------------
  # MongoDB. For production you may INSTEAD use MongoDB Atlas: set MONGO_URL to
  # your Atlas SRV string in .env and delete/comment this whole service.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not published to the host — only reachable inside the compose network.

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: ${APP_ENV}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Emergent-managed integrations (fallback only if S3/SMTP unset)
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      EMERGENT_EMAIL_KEY: ${EMERGENT_EMAIL_KEY}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      # Object storage (S3-compatible)
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      # Email (production SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      # Payments (Razorpay)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      # SMS OTP (Twilio Verify)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
    expose:
      - "8001"

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # For HTTPS, terminate TLS in front (Caddy/Traefik/Cloudflare/Certbot).
      # See README for a Certbot + host-nginx option.

volumes:
  mongo_data:
